# Cloudflare Pages pxwa – abgeglichen mit dem bestehenden Live-Projekt.
# Der Soft-Launch hat kein API-Service-Binding. MEDIA ist für die ausgelieferten R2-Medien eingerichtet.
# Deploy nur mit eigener Freigabe für genau einen Commit-SHA (docs/deploy-cloudflare-pages.md).
name = "pxwa"
pages_build_output_dir = "./public"
compatibility_date = "2026-07-30"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "360pixelkiez"

[env.production]
compatibility_date = "2026-11-01"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "360pixelkiez"

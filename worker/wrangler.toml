# 360°Pixelkiez – privater API-Worker. Erreichbar nur über das Service Binding "API" der Pages-Website
# (Root-wrangler.toml, functions/api/[[path]].ts). Vorlage ohne Secrets; Deploy nur mit eigener Freigabe für genau einen Commit-SHA.
# Secrets (nie hier eintragen): npx wrangler secret put GOOGLE_CLIENT_SECRET | SECRET | MAIL_API_TOKEN | ACCESS_ALLOWLIST
name = "pxwa-api"
main = "src/index.ts"
compatibility_date = "2026-07-30"

# Keine öffentliche Adresse: keine *.workers.dev-Adresse, keine Vorschau-URLs und keine Route.
# Eine Cloudflare-Zone ist nicht nötig; das DNS von pixelkiez.de bleibt bei Hostinger.
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

# D1 mit EU-Jurisdiktion, angelegt am 01.11.2026 mit `npx wrangler d1 create pxwa --jurisdiction eu` (Region EEUR).
# Die ID ist kein Geheimnis; Schema erst mit eigener Freigabe: npx wrangler d1 migrations apply pxwa --remote
[[d1_databases]]
binding = "DB"
database_name = "pxwa"
database_id = "3a5e6c3c-89f4-4b13-83ee-b70e151dc9b0"
migrations_dir = "migrations"

[vars]
ENV = "production"
BASE_URL = "https://360.pixelkiez.de"
GOOGLE_CLIENT_ID = "992953187599-gabq9k5shdu02qd0r4ldqa3dh7ib0c1o.apps.googleusercontent.com"
# Version der Datenschutzerklärung, die mit jedem Auftrag gespeichert wird. Mit "ENTWURF-…" nimmt die Produktion keine Aufträge an.
# Fassung 2026-11-13 (Abschnitte 8, 11, 12, 14, 16 am tatsächlichen Betrieb: nur die Datenbank löscht automatisch, Postfach von
# Hand; kein Newsletter, keine Verteilerliste), Wortlaut vom Auftraggeber am 13.11.2026 freigegeben (Blob 42d72694).
PRIVACY_VERSION = "2026-11-13"
# Version der AGB, die die Bestätigungsseite zeigt (Feld agb_version) und jeder Auftrag speichert. Mit "ENTWURF-…" nimmt die
# Produktion keine Aufträge an. Fassung 2026-11-12 (§§ 3, 4, 6: ein Kästchen), Wortlaut vom Auftraggeber am 13.11.2026
# freigegeben (Blob 8da420bf). Bei jeder neuen Fassung der Seiten: erst ENTWURF, nach Freigabe eigener Aktivierungs-Commit.
TERMS_VERSION = "2026-11-12"
# Einzige freigegebene Mail-API (Resend). Der API-Key kommt als Secret MAIL_API_TOKEN.
MAIL_API_URL = "https://api.resend.com/emails"
# Absender (PO-Freigabe 10.11.2026), Resend-Versanddomain 360.pixelkiez.de.
MAIL_FROM = "anfrage@360.pixelkiez.de"
# Einziger interner Empfänger (fest im Code, PRODUCTION_NOTIFY_TO). Erst deployen, wenn das Postfach 360@pixelkiez.de
# existiert und eine Zustellung nachgewiesen ist (docs/deploy-cloudflare-pages.md, Abschnitt 6).
MAIL_NOTIFY_TO = "360@pixelkiez.de"
# Löschfrist für Aufträge in Tagen (Entscheidung des Auftraggebers 04.11.2026: vier Monate ab Eingang; Datenschutzerklärung
# Abschnitte 8 und 16). Der Cron löscht ältere Aufträge samt interner Benachrichtigung.
ORDER_RETENTION_DAYS = "120"
# Zugang (PXK-155): "testnutzer" = nach der Google-Anmeldung legen nur die Konten aus dem Secret ACCESS_ALLOWLIST einen Auftrag
# an (kontrollierter Test, auch bei direktem Aufruf von /api/anfrage); alle anderen erhalten 403 ohne Auftrag und ohne Mail.
# "offen" = öffentlicher Betrieb, nur mit eigener Release-Freigabe für genau einen SHA. Ohne gültigen Wert: keine Anfragen.
ACCESS_MODE = "testnutzer"

# Betriebsprotokoll (Workers Logs) nur mit eigenen Meldungen (Anzahlen, Auftragsreferenzen, Fehlerarten – keine IP- oder
# E-Mail-Adressen); keine automatischen Aufrufprotokolle mit Anfrage-Metadaten. Aufbewahrung bei Cloudflare 3 bzw. 7 Tage.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
